<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./scripts/api.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
    <script src="./scripts/dialog.js" defer></script>
    <script src="./script.js" defer></script>
    <title>Pokédex | Tino Helmbold</title>
    <link rel="icon" type="image/png" href="./assets/imgs/pokeball.png" />
    <link rel="stylesheet" href="./styles/template-styles.css" />
    <link rel="stylesheet" href="./styles/pagination.css" />
    <link rel="stylesheet" href="./styles/dialog.css" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
  </head>

  <body>
    <header>
      <a href="./index.html" class="logo">
        <img src="./assets/imgs/pokeball.png" alt="Pokeball Logo" />
        <h1>
          <span class="logo-light">Poké</span><span class="logo-red">Dex</span>
          <span class="logo-author"> by T.H</span>
        </h1>
      </a>
      <div class="search">
        <input
          type="search"
          id="search-input"
          name="search"
          data-id="search-input"
          aria-label="Search for a Pokémon"
          placeholder="Search for a Pokémon"
          minlength="3"
        />
        <button
          data-id="search-button"
          aria-label="Search for a Pokémon"
          type="button"
        >
          Search
        </button>
        <p class="search-hint" data-id="search-hint" role="status" hidden>
          Please enter at least 3 letters.
        </p>
      </div>
    </header>

    <main data-id="content">
      <ul data-id="pokemon-list"></ul>
      <div class="message" data-id="message"></div>
      <nav
        class="pagination"
        data-id="pagination"
        aria-label="Pokémon pages"
      ></nav>
      <div
        class="loader"
        data-id="loader"
        role="status"
        aria-live="polite"
        hidden
      >
        <div class="loading-spinner" aria-hidden="true">
          <svg
            class="loading-spinner-ring"
            viewBox="0 0 100 100"
            focusable="false"
          >
            <circle
              class="loading-spinner-track"
              cx="50"
              cy="50"
              r="42"
            ></circle>
            <circle
              class="loading-spinner-arc"
              cx="50"
              cy="50"
              r="42"
              pathLength="100"
            ></circle>
          </svg>
          <span class="loading-spinner-core">
            <img
              class="loading-spinner-ball"
              src="./assets/imgs/pokeball.png"
              alt=""
            />
          </span>
        </div>
        <span>Loading Pokémon...</span>
      </div>
    </main>
    <dialog class="dialog" data-id="dialog" aria-label="Pokémon details">
      <button
        class="dialog-close"
        data-id="close-dialog-button"
        type="button"
        aria-label="Close details"
      >
        x
      </button>
      <button
        class="dialog-nav dialog-prev"
        data-id="prev-button"
        type="button"
        aria-label="Previous Pokémon"
      >
        &lt;
      </button>
      <button
        class="dialog-nav dialog-next"
        data-id="next-button"
        type="button"
        aria-label="Next Pokémon"
      >
        &gt;
      </button>
      <div class="dialog-content" data-id="overlay-pokemon-name"></div>
    </dialog>

    <footer class="footer">
      <p class="footer-brand">
        Poké<span class="footer-accent">Dex</span> by T.H
      </p>
      <div class="footer-center">
        <p class="footer-credit">
          Data provided by
          <a
            class="footer-link"
            href="https://pokeapi.co"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="PokeAPI"
          >
            PokéAPI
          </a>
        </p>
        <p class="footer-note">Educational project</p>
      </div>
      <a
        class="footer-link footer-github"
        href="https://github.com/TinoHlm/DA-Pokedex"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Project on GitHub"
      >
        GitHub
        <span class="footer-icon" aria-hidden="true">&#8599;</span>
      </a>
    </footer>
  </body>
</html>
