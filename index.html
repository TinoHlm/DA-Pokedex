<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <title>Pokedex | Tino Helmbold</title>
    <link rel="icon" type="image/x-icon" href="./assets/imgs/pokeball.png" />
  </head>

  <body>
    <header>
      <a href="./index.html" class="logo">
        <img src="./assets/imgs/pokeball.png" alt="Pokeball Logo" />
        <h1>
            <span class="logo-light">Poke</span><span class="logo-red">Dex</span>
            <span class="logo-author"> by T.H</span>
        </h1>
      </a>
      <div class="search">
        <input
          type="text"
          data-id="search-input"
          placeholder="Suche nach einem Pokémon..."
        />
        <button data-id="search-button">Suchen</button>
      </div>
    </header>

    <main data-id="content">
      <ul>
        <li></li>
      </ul>
    </main>
  </body>
</html>
