<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./templates.js" defer></script>
    <script src="./script.js" defer></script>
    <title>Pokédex | Tino Helmbold</title>
    <link rel="icon" type="image/x-icon" href="./assets/imgs/pokeball.png" />
    <link rel="stylesheet" href="./styles/template-styles.css" />
    <link rel="stylesheet" href="./styles/pagination.css" />
  </head>

  <body onload="initPagination()">
    <header>
      <a href="./index.html" class="logo">
        <img src="./assets/imgs/pokeball.png" alt="Pokeball Logo" />
        <h1>
          <span class="logo-light">Poké</span><span class="logo-red">Dex</span>
          <span class="logo-author"> by T.H</span>
        </h1>
      </a>
      <div class="search">
        <input
          type="search"
          data-id="search-input"
          aria-label="Search for a Pokémon"
          placeholder="Search for a Pokémon"
          minlength="3"
        />
        <button
          data-id="search-button"
          aria-label="Search for a Pokémon"
          type="button"
        >
          Search
        </button>
      </div>
    </header>

    <main data-id="content">
      <ul data-id="pokemon-list"></ul>
      <nav
        class="pagination"
        data-id="pagination"
        aria-label="Pokemon pages"
      ></nav>
      <div
        class="loader"
        data-id="loader"
        role="status"
        aria-live="polite"
        hidden
      >
        <span class="loading-spinner" aria-hidden="true"></span>
        <span>Loading Pokémon</span>
      </div>
    </main>
  </body>
</html>
