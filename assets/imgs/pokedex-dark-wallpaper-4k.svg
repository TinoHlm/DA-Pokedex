  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="960" cy="520" r="355" fill="#111315" opacity="0.22" filter="url(#soft-shadow)"/>
  <rect width="1920" height="1080" fill="url(#monster-pattern)" opacity="0.37"/>
  <g fill="none" stroke="#d94141" stroke-width="24" opacity="0.055">
    <circle cx="960" cy="520" r="310"/><path d="M652 520h208m200 0h208"/><circle cx="960" cy="520" r="100"/><circle cx="960" cy="520" r="47"/>
  </g>
  <rect width="1920" height="1080" fill="url(#soft-center)"/>
  <g fill="#df4545" opacity="0.13">
    <circle cx="122" cy="174" r="4"/><circle cx="477" cy="911" r="3"/><circle cx="1488" cy="155" r="3"/><circle cx="1778" cy="776" r="4"/>
  </g>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
