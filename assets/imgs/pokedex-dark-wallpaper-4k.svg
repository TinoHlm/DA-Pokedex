<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3840"
     height="2160"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Minimalist dark Pokédex wallpaper in 4K</title>
  <desc id="desc">A subtle charcoal wallpaper with a repeating monster line-art pattern and a faint Pokéball-inspired watermark.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292d31"/>
      <stop offset="0.48" stop-color="#24282c"/>
      <stop offset="1" stop-color="#1f2226"/>
    </linearGradient>
    <radialGradient id="soft-center" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#34393e" stop-opacity="0.5"/>
      <stop offset="0.58" stop-color="#272b2f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#17191c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0.55" stop-color="#090a0b" stop-opacity="0"/>
      <stop offset="1" stop-color="#090a0b" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <symbol id="orb" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="39"/><path d="M12 49h23m30 0h23"/><circle cx="50" cy="49" r="14"/><circle cx="50" cy="49" r="6"/>
    </symbol>
    <symbol id="leafling" viewBox="0 0 120 100">
      <path d="M25 58c0-22 15-37 36-37 25 0 40 18 40 40 0 17-13 27-29 27H51c-16 0-26-10-26-30Z"/>
      <path d="M52 23C47 7 59 3 69 14 82 1 94 11 83 26"/><path d="M31 45 16 34m83 12 12-12M45 63c5 5 10 7 16 7s12-2 17-7"/>
      <circle cx="45" cy="49" r="3" fill="currentColor" stroke="none"/><circle cx="78" cy="49" r="3" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="sparkster" viewBox="0 0 130 105">
      <path d="M34 76c-12-9-16-25-10-39 4-10 13-17 24-20l3-13 13 11c11 0 20 4 27 12l15-4-6 17c2 5 3 10 2 16-2 19-18 32-38 32-12 0-22-4-30-12Z"/>
      <path d="M100 55h17l-12 13 17 5-25 18"/><path d="M47 59c10 8 21 8 32 0"/>
      <circle cx="46" cy="44" r="3" fill="currentColor" stroke="none"/><circle cx="79" cy="44" r="3" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="shellback" viewBox="0 0 130 100">
      <path d="M37 72c-14-6-20-22-15-36 5-16 20-25 37-24 20 1 35 13 39 31l16 7-15 12c-6 15-21 24-39 24-9 0-17-2-23-6"/>
      <path d="M39 61c-7-22 6-41 26-41 17 0 29 13 29 31 0 12-5 22-15 29"/><path d="m50 29 28 39M84 26 48 72M22 44 7 37m20 30-16 7"/>
      <circle cx="108" cy="48" r="3" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="flaretail" viewBox="0 0 135 105">
      <path d="M32 74c-10-9-13-24-8-37 6-15 20-24 36-24 23 0 40 16 40 38 0 5-1 9-3 13l15 13"/>
      <path d="M107 79c1-14 12-18 18-30 9 18 0 34-15 37"/><path d="M46 61c9 7 19 7 29 0M48 30 38 17m36 10 7-15"/>
      <circle cx="45" cy="45" r="3" fill="currentColor" stroke="none"/><circle cx="78" cy="45" r="3" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="wisp" viewBox="0 0 105 100">
      <path d="M19 77c8-7 4-18 3-29-2-20 11-35 31-35 21 0 34 15 31 37-2 15 2 26 10 35-11 3-19-1-24-8-9 11-22 11-31 1-6 7-13 9-20 6Z"/>
      <path d="m37 43 9 7-10 7m34-14-9 7 10 7M45 69c6 4 12 4 18 0"/>
    </symbol>
    <symbol id="winglet" viewBox="0 0 125 100">
      <path d="M47 79c-19-4-30-19-27-36 3-18 19-29 38-26 9 1 16 5 22 11l28-10-16 24c4 19-9 36-31 39"/>
      <path d="M42 57c13 1 23-5 30-17M82 51l26 12-24 7M40 28 32 14"/><circle cx="48" cy="39" r="3" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="sprout" viewBox="0 0 70 70"><path d="M35 58V28M34 29C16 27 12 15 13 8c14-1 25 6 23 20Zm2-5C39 10 49 6 60 9c-1 12-9 19-24 17Z"/></symbol>
    <symbol id="bolt" viewBox="0 0 70 90"><path d="m40 5-25 43h22l-8 37 27-47H35Z"/></symbol>
    <symbol id="droplet" viewBox="0 0 70 90"><path d="M35 6C30 20 15 34 15 52c0 13 9 24 20 24s20-11 20-24C55 34 40 20 35 6Z"/><path d="M28 59c3 4 7 6 12 5"/></symbol>

    <pattern id="monster-pattern" width="520" height="390" patternUnits="userSpaceOnUse" patternTransform="rotate(-2)">
      <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" color="#0d0f11">
        <use xlink:href="#leafling" x="18" y="20" width="96" height="80" transform="rotate(-8 66 60)"/>
        <use xlink:href="#orb" x="157" y="8" width="72" height="72" transform="rotate(9 193 44)"/>
        <use xlink:href="#winglet" x="279" y="18" width="105" height="84" transform="rotate(8 331 60)"/>
        <use xlink:href="#sprout" x="440" y="19" width="47" height="47" transform="rotate(12 463 42)"/>
        <use xlink:href="#bolt" x="1" y="131" width="42" height="54" transform="rotate(-13 22 158)"/>
        <use xlink:href="#sparkster" x="82" y="108" width="111" height="90" transform="rotate(5 137 153)"/>
        <use xlink:href="#wisp" x="239" y="112" width="85" height="81" transform="rotate(-9 281 152)"/>
        <use xlink:href="#shellback" x="359" y="104" width="116" height="91" transform="rotate(6 417 149)"/>
        <use xlink:href="#droplet" x="31" y="246" width="46" height="59" transform="rotate(9 54 275)"/>
        <use xlink:href="#flaretail" x="103" y="231" width="115" height="91" transform="rotate(-7 160 276)"/>
        <use xlink:href="#orb" x="258" y="242" width="77" height="77" transform="rotate(-5 296 280)"/>
        <use xlink:href="#leafling" x="378" y="226" width="105" height="87" transform="rotate(7 430 269)"/>
        <path d="M145 347c9-8 18-8 27 0s18 8 27 0M353 350c7-7 14-7 21 0s14 7 21 0"/>
        <circle cx="33" cy="357" r="6"/><circle cx="494" cy="350" r="4"/>
      </g>
